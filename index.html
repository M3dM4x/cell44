<title>THE CELL 44</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e14;
  --bg2: #11151c;
  --bg3: #181d26;
  --border: #232934;
  --border2: #2c333f;
  --text: #e6edf3;
  --text2: #8d96a7;
  --text3: #5e6675;
  --cyan: #00d4ff;
  --gold: #f0c040;
  --green: #00e676;
  --red: #ff5050;
  --r-md: 10px;
  --r-sm: 6px;
  --fs-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace;
  --fs-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--fs-sans);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 16px;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,212,255,.05) 0%, transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(240,192,64,.04) 0%, transparent 60%);
}
.gate {
  width: 100%; max-width: 380px;
  background: linear-gradient(180deg, var(--bg2), var(--bg3));
  border: 0.5px solid var(--border2);
  border-radius: 14px;
  padding: 32px 28px 28px;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(0,212,255,.05) inset;
}
.logo-wrap { display: flex; justify-content: center; margin-bottom: 18px; }
.logo { width: 72px; height: 72px; filter: drop-shadow(0 4px 12px rgba(0,212,255,.15)); }
.brand {
  text-align: center;
  font-weight: 800; font-size: 22px;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.brand .accent { color: var(--cyan); }
.tagline {
  text-align: center;
  color: var(--text3);
  font-size: 9px;
  font-family: var(--fs-mono);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 26px;
}
.lock-line {
  display: flex; align-items: center; gap: 8px;
  justify-content: center;
  color: var(--text3);
  font-size: 10px;
  font-family: var(--fs-mono);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 18px;
}
.lock-line svg { width: 12px; height: 12px; }
.field {
  position: relative;
  margin-bottom: 14px;
}
.field input {
  width: 100%;
  background: var(--bg);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-md);
  padding: 14px 16px;
  font-family: var(--fs-mono);
  font-size: 14px;
  color: var(--text);
  letter-spacing: 1px;
  transition: border-color .15s, background .15s;
  outline: none;
}
.field input:focus { border-color: var(--cyan); background: var(--bg2); }
.field input.err { border-color: var(--red); animation: shake .35s; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
}
.btn {
  width: 100%;
  padding: 14px 16px;
  background: linear-gradient(135deg, var(--cyan), #0099cc);
  border: none;
  border-radius: var(--r-md);
  color: #03141a;
  font-family: var(--fs-sans);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .12s, box-shadow .15s, opacity .15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,212,255,.25); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn .spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(0,0,0,.2);
  border-top-color: #03141a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}
.btn.busy .spinner { display: block; }
.btn.busy .label { opacity: 0.7; }
@keyframes spin { to { transform: rotate(360deg); } }

.status {
  margin-top: 14px;
  text-align: center;
  font-size: 11px;
  font-family: var(--fs-mono);
  min-height: 16px;
  color: var(--text3);
  letter-spacing: 0.5px;
}
.status.err { color: var(--red); }
.status.ok { color: var(--green); }
.status.warn { color: var(--gold); }

.foot {
  margin-top: 22px;
  padding-top: 16px;
  border-top: 0.5px solid var(--border);
  text-align: center;
  font-size: 9px;
  font-family: var(--fs-mono);
  color: var(--text3);
  letter-spacing: 1px;
}
.foot .dot { color: var(--cyan); }

@media (max-width: 420px) {
  .gate { padding: 26px 22px 22px; }
  .logo { width: 64px; height: 64px; }
  .brand { font-size: 20px; }
}
</style>

  <h1 class="brand">THE CELL <span class="accent">44</span></h1>
  <p class="tagline">Strategic FX Terminal</p>

  <div class="lock-line">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="5" y="11" width="14" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 018 0v4"/>
    </svg>
    Restricted Access
  </div>

  <form id="gateForm" autocomplete="off">
    <div class="field">
      <input type="password" id="pw" placeholder="Access key" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" required>
    </div>
    <button type="submit" class="btn" id="unlockBtn">
      <div class="spinner"></div>
      <span class="label">UNLOCK</span>
    </button>
  </form>

  <p class="status" id="status"></p>

  <div class="foot">
    <span class="dot">●</span> thecell44.online
  </div>
</main>

<script>
(function(){
  'use strict';

  const ENCRYPTED_FILE = 'cell44.encrypted';
  const SESSION_KEY = 'cell44_unlock_v1';
  const SESSION_HOURS = 24;

  const $ = id => document.getElementById(id);
  const status = (msg, cls) => {
    const s = $('status');
    s.textContent = msg;
    s.className = 'status' + (cls ? ' ' + cls : '');
  };

  // ── Auto-unlock if session valid ──
  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (saved && saved.exp > Date.now() && saved.pw) {
      tryUnlock(saved.pw, true).catch(() => {
        localStorage.removeItem(SESSION_KEY);
      });
    }
  } catch (_) {}

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value.trim();
    if (!pw) return;
    await tryUnlock(pw, false);
  });

  async function tryUnlock(pw, silent) {
    const btn = $('unlockBtn');
    const inp = $('pw');
    btn.disabled = true;
    btn.classList.add('busy');
    inp.classList.remove('err');
    if (!silent) status('Deriving key...', 'warn');

    try {
      // Fetch encrypted package
      const r = await fetch(ENCRYPTED_FILE + '?v=' + Date.now(), {cache: 'no-store'});
      if (!r.ok) throw new Error('Encrypted file not found');
      const pkg = await r.json();

      // Decode b64
      const b64dec = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
      const salt = b64dec(pkg.salt);
      const iv = b64dec(pkg.iv);
      const ct = b64dec(pkg.ct);

      // Derive key with PBKDF2-SHA256
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        'raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        {name: 'PBKDF2', salt, iterations: pkg.iter || 100000, hash: 'SHA-256'},
        baseKey,
        {name: 'AES-GCM', length: 256},
        false,
        ['decrypt']
      );

      if (!silent) status('Decrypting...', 'warn');

      // Decrypt
      const ptBuf = await crypto.subtle.decrypt({name: 'AES-GCM', iv}, key, ct);
      const html = new TextDecoder('utf-8').decode(ptBuf);

      // Sanity check (must be HTML)
      if (!html.includes('<!DOCTYPE html') && !html.includes('<html')) {
        throw new Error('Decrypted content is not valid HTML');
      }

      status('Unlocked', 'ok');

      // Save session (24h)
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          pw: pw,
          exp: Date.now() + SESSION_HOURS * 3600 * 1000
        }));
      } catch (_) {}

      // Replace document with decrypted HTML
      // Use a slight delay so user sees the success state briefly
      setTimeout(() => {
        document.open();
        document.write(html);
        document.close();
      }, silent ? 0 : 250);

    } catch (err) {
      btn.disabled = false;
      btn.classList.remove('busy');
      inp.classList.add('err');
      inp.select();

      // Hide internal error details from UI (security)
      // Most likely cause: wrong password (AES-GCM auth tag mismatch)
      const isAuthError = err.name === 'OperationError' || /decrypt/i.test(err.message);
      if (isAuthError) {
        status('Invalid access key', 'err');
      } else if (/not found/i.test(err.message)) {
        status('Encrypted file missing — contact admin', 'err');
      } else {
        status('Unlock failed — try again', 'err');
      }

      // Throttle on repeated failures (3 wrong = 5 sec lockout)
      window._failCount = (window._failCount || 0) + 1;
      if (window._failCount >= 3) {
        btn.disabled = true;
        let remaining = Math.min(30, 5 * Math.pow(2, window._failCount - 3));
        status('Too many attempts. Wait ' + remaining + 's', 'err');
        const tick = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(tick);
            btn.disabled = false;
            status('');
            window._failCount = 0;
          } else {
            status('Wait ' + remaining + 's', 'err');
          }
        }, 1000);
      }
    }
  }

  // Focus input on load
  $('pw').focus();
})();
</script>
