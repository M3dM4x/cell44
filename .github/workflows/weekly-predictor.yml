name: Weekly Forex Predictor

# Friday 22:00 Casablanca = Friday 21:00 UTC (Morocco is UTC+1, no DST)
on:
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate predictions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'

      - name: Install dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly predictions
        working-directory: pipeline
        run: python generate_predictions.py

      - name: Validate prediction count
        id: validate
        run: |
          EVENT_COUNT=$(python -c "import json; data=json.load(open('pipeline/data/predictions.json')); print(len(data.get('events', [])))")
          echo "Events generated: $EVENT_COUNT"
          echo "events=$EVENT_COUNT" >> $GITHUB_OUTPUT
          if [ "$EVENT_COUNT" -lt 1 ]; then
            echo "::warning::Scraper returned 0 events — likely Cloudflare blocked the GitHub Actions runner IP. Skipping commit to preserve last good predictions.json."
          fi

      - name: Copy predictions to web root (only if events found)
        if: steps.validate.outputs.events != '0'
        run: cp pipeline/data/predictions.json predictions.json

      - name: Commit and push if changed
        if: steps.validate.outputs.events != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions.json
          if git diff --staged --quiet; then
            echo "No changes — predictions identical to previous run."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: weekly predictions update ($TIMESTAMP)"
            git push
            echo "✓ Pushed new predictions.json"
          fi

      - name: Skip notice (if no events)
        if: steps.validate.outputs.events == '0'
        run: |
          echo "::notice::Workflow completed but skipped commit. Last good predictions.json preserved on the live site."
