name: Talaria Sentiment Engine

# Casablanca = UTC+1 year-round (no DST). Schedules use UTC.
#   23:00 UTC (prev day) = 00:00 Casablanca → Tokyo open
#   06:00 UTC            = 07:00 Casablanca → Pre-London
#   12:30 UTC            = 13:30 Casablanca → Pre-NY
#   19:00 UTC            = 20:00 Casablanca → NY close
on:
  schedule:
    - cron: '0 23 * * 0-4'   # Sun-Thu nights = Mon-Fri 00:00 Casablanca
    - cron: '0 6 * * 1-5'    # Mon-Fri 07:00 Casablanca
    - cron: '30 12 * * 1-5'  # Mon-Fri 13:30 Casablanca
    - cron: '0 19 * * 1-5'   # Mon-Fri 20:00 Casablanca
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cell44-talaria
  cancel-in-progress: false

jobs:
  talaria:
    name: Run Talaria sentiment engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Talaria fetcher
        working-directory: pipeline
        run: python run_talaria.py

      - name: Validate output
        id: validate
        run: |
          if [ ! -f pipeline/data/talaria.json ]; then
            echo "::error::talaria.json not produced"
            exit 1
          fi
          OPPS=$(python -c "import json; d=json.load(open('pipeline/data/talaria.json')); print(len(d.get('opportunities', [])))")
          QUALITY=$(python -c "import json; d=json.load(open('pipeline/data/talaria.json')); print(d.get('meta', {}).get('data_quality', 'unknown'))")
          echo "Opportunities: $OPPS · Quality: $QUALITY"
          echo "opps=$OPPS" >> $GITHUB_OUTPUT
          echo "quality=$QUALITY" >> $GITHUB_OUTPUT
          if [ "$OPPS" -lt 1 ]; then
            echo "::warning::No opportunities computed — refusing to overwrite live talaria.json"
          fi

      - name: Copy to web root
        if: steps.validate.outputs.opps != '0'
        run: cp pipeline/data/talaria.json talaria.json

      - name: Commit and push
        if: steps.validate.outputs.opps != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talaria.json
          if git diff --staged --quiet; then
            echo "No changes to talaria.json"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: talaria refresh ($TIMESTAMP) [quality: ${{ steps.validate.outputs.quality }}]"
            git push
            echo "✓ Pushed updated talaria.json"
          fi
